<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script>
  (function () {
    var saved = null;
    try { saved = localStorage.getItem('btmats-theme'); } catch (e) {}
    if (saved !== 'light' && saved !== 'dark') {
      saved = (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light';
    }
    document.documentElement.setAttribute('data-theme', saved);
  })();
</script>
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#FAF9F6">
<title>404 · 页面不存在</title>
<style>
  :root {
    --paper: #FAF9F6; --ink: #1C1B19; --gray: #6E6A63;
    --muted: #98938A; --line: #E6E2D9; --accent: #B2634C;
    color-scheme: light;
  }
  :root[data-theme="dark"] {
    --paper: #171614; --ink: #E8E5DE; --gray: #A6A096;
    --muted: #857F75; --line: #2E2C28; --accent: #D48A6F;
    color-scheme: dark;
  }
  html, body { height: 100%; margin: 0; background: var(--paper); color: var(--ink);
    font-family: "IBM Plex Sans", "Noto Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif; }
  main { min-height: 100%; display: grid; place-content: center; justify-items: start; gap: 24px;
    padding: 48px; max-width: 720px; margin-inline: auto; }
  .code { margin: 0; font-family: "EB Garamond", "Noto Serif SC", Georgia, serif;
    font-size: clamp(64px, 14vw, 120px); font-weight: 400; line-height: 1; letter-spacing: -0.01em; }
  p { margin: 0; font-size: 15px; line-height: 1.7; color: var(--gray); }
  a { color: var(--ink); text-decoration: underline; text-decoration-thickness: 1px;
    text-decoration-color: var(--muted); text-underline-offset: 3px; }
  a:hover { text-decoration-color: var(--accent); }
  .rule { width: 100%; height: 1px; background: var(--line); }
</style>
</head>
<body>
  <main>
    <p class="code">404</p>
    <div class="rule"></div>
    <p>这个地址没有内容。也许是链接错了，也许是文章被我删了。</p>
    <p><a href="/">回到封面</a> · <a href="/blog/">进入博客</a></p>
  </main>
</body>
</html>
